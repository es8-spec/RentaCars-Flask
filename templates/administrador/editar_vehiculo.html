{% extends 'layout/base.html' %}
{% block titulo %}Editar Vehículo{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-warning">
                <h4>Editar Vehículo</h4>
            </div>
            <div class="card-body">
                {% if mensaje %}
                <div class="alert alert-{{ tipo_mensaje }}">{{ mensaje }}</div>
                {% endif %}
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label>Marca</label>
                        <input type="text" name="marca" class="form-control" value="{{ vehiculo[1] }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Modelo</label>
                        <input type="text" name="modelo" class="form-control" value="{{ vehiculo[2] }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Año</label>
                        <input type="number" name="anio" class="form-control" value="{{ vehiculo[3] }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Placa</label>
                        <input type="text" name="placa" class="form-control" value="{{ vehiculo[4] }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Precio</label>
                        <input type="number" step="0.01" name="precio" class="form-control" value="{{ vehiculo[5] }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Imagen actual</label><br>
                        {% if vehiculo[6] %}
                        <img src="{{ url_for('static', filename='subidos/vehiculos/' ~ vehiculo[6]) }}" width="180">
                        {% else %}
                        <p>Sin imagen</p>
                        {% endif %}
                    </div>
                    <div class="mb-3">
                        <label>Nueva imagen</label>
                        <input type="file" name="imagen" class="form-control">
                    </div>
                    <button class="btn btn-warning">Actualizar</button>
                    <a href="{{ url_for('administrador.listar_vehiculos') }}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
